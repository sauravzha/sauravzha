<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Saurav Jha — Software Engineering</title>
  <desc id="desc">A dark technical blueprint with a software engineering identity and systems diagram.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080e19"/>
      <stop offset="0.58" stop-color="#101c2d"/>
      <stop offset="1" stop-color="#111326"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#62e6d5"/>
      <stop offset="1" stop-color="#71a7ff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#9bb7d1" stroke-opacity=".09" stroke-width="1"/>
      <circle cx="0" cy="0" r="1.3" fill="#9bb7d1" fill-opacity=".18"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="22" fill="url(#grid)"/>
  <path d="M0 286H1200" stroke="#6b91b8" stroke-opacity=".22"/>
  <path d="M790 0V360" stroke="#6b91b8" stroke-opacity=".15"/>
  <rect x="58" y="48" width="6" height="34" rx="3" fill="url(#accent)"/>
  <text x="84" y="70" fill="#92a9c2" font-family="monospace" font-size="15" letter-spacing="3">ENGINEERING / PRODUCT / APPLIED AI</text>
  <text x="58" y="166" fill="#f1f6fc" font-family="Arial, Helvetica, sans-serif" font-size="68" font-weight="700" letter-spacing="-2">SAURAV JHA</text>
  <text x="62" y="211" fill="#b8c8db" font-family="Arial, Helvetica, sans-serif" font-size="25">Building useful software, from interface to intelligence.</text>
  <rect x="60" y="246" width="202" height="3" rx="1.5" fill="url(#accent)"/>
  <text x="60" y="276" fill="#75e0d2" font-family="monospace" font-size="14" letter-spacing="2">FULL-STACK  ·  AI/ML  ·  COMPUTER VISION</text>
  <g transform="translate(850 54)">
    <rect width="286" height="238" rx="14" fill="#09111d" fill-opacity=".88" stroke="#48627b" stroke-opacity=".72"/>
    <path d="M0 43H286" stroke="#48627b" stroke-opacity=".7"/>
    <circle cx="22" cy="22" r="5" fill="#ff7b72"/>
    <circle cx="42" cy="22" r="5" fill="#e8c36a"/>
    <circle cx="62" cy="22" r="5" fill="#62d6ad"/>
    <text x="22" y="76" fill="#75e0d2" font-family="monospace" font-size="12" letter-spacing="1.5">BUILD / ITERATE / SHIP</text>
    <g font-family="monospace" font-size="13">
      <text x="22" y="111" fill="#7b91aa">01</text><text x="54" y="111" fill="#dce8f5">Product engineering</text>
      <text x="22" y="146" fill="#7b91aa">02</text><text x="54" y="146" fill="#dce8f5">Applied machine learning</text>
      <text x="22" y="181" fill="#7b91aa">03</text><text x="54" y="181" fill="#dce8f5">Real-world problem solving</text>
    </g>
    <path d="M22 205H74L90 193H139L155 205H263" fill="none" stroke="url(#accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="90" cy="193" r="3.5" fill="#62e6d5"/>
    <circle cx="155" cy="205" r="3.5" fill="#71a7ff"/>
  </g>
  <text x="60" y="328" fill="#71869e" font-family="monospace" font-size="12" letter-spacing="1.5">GITHUB.COM/SAURAVZHA</text>
  <text x="1138" y="328" text-anchor="end" fill="#71869e" font-family="monospace" font-size="12">IN / 2026</text>
</svg>